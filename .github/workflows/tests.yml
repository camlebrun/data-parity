name: tests

# Runs the test suite on Linux, macOS and Windows for every supported Python, so the
# "cross-platform" claim of the README is backed by a green job (spec: pypi-distribution).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and pytest
        run: python -m pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest -q
